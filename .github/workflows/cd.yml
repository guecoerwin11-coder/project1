# CD = Continuous Delivery / Deployment
# Runs when code lands on main, or when you push a version tag like v1.0.0.
#
#   1. ci        runs the full CI workflow first. If it fails, nothing is published.
#   2. publish   builds the Docker image and pushes it to GitHub Container Registry:
#                  ghcr.io/<owner>/<repo>/backend:latest      (every push to main)
#                  ghcr.io/<owner>/<repo>/backend:sha-abc1234 (every push, never changes)
#                  ghcr.io/<owner>/<repo>/backend:1.2.0       (tag v1.2.0)
#   3. deploy    OPTIONAL. Logs in to your server over SSH and runs the new image.
#                Turned off until you set up a server. See the steps at the bottom.

name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deploys at the same time, and never cancel one halfway
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: publish
    # Off until you set the repository variable DEPLOY_ENABLED to true
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Pull the new image and restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH || '$HOME/eshop' }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export BACKEND_IMAGE="$IMAGE:latest"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

# ---------------------------------------------------------------------------
# Turning on the deploy job (one time):
#
#  1. On your server: install Docker, create the folder ~/eshop, and copy
#     docker-compose.prod.yml and a .env file with your production secrets into it.
#  2. GitHub repo -> Settings -> Secrets and variables -> Actions:
#       Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key),
#                  GHCR_READ_TOKEN (a token with read:packages, so the server can pull)
#                  DEPLOY_PORT (optional, default 22)
#       Variables: DEPLOY_ENABLED = true
#                  DEPLOY_PATH (optional, default ~/eshop)
#  3. Settings -> Environments -> production: optionally require approval
#     so a person must click "Approve" before every deploy.
# ---------------------------------------------------------------------------
