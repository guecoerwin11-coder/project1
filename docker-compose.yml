# Runs the whole backend on your computer with one command:
#   docker compose up --build
#
# Services:
#   postgres  the database
#   redis     the order queue
#   migrate   applies database migrations once, then stops
#   api       the Express API         -> http://localhost:3000  (docs at /api-docs)
#   worker    places queued orders
#
# Secrets (JWT_PASS, JWT_FRESH) are read from backend/.env.
# Database and Redis addresses are set below, so they point at these containers.

name: eshop

x-backend: &backend
  build:
    context: ./backend
  image: eshop-backend:local
  env_file:
    - path: ./backend/.env
      required: false
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgresql://eshop:${POSTGRES_PASSWORD:-eshop}@postgres:5432/eshop
    REDIS_URL: redis://redis:6379
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshop}
      POSTGRES_DB: eshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 on your computer, so it does not clash with a Postgres you already run on 5432
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshop -d eshop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly: Redis saves jobs to disk, so queued orders survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["npm", "run", "migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["node", "worker.js"]
    environment:
      <<: *backend-env
      ORDER_WORKER_CONCURRENCY: ${ORDER_WORKER_CONCURRENCY:-1}
    # The worker has no web server, so turn off the image's /health check
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
